    <div class="intro" aria-hidden="true">
      <span class="intro__monogram">VS<span class="intro__star">✦</span></span>

    <div class="page-shell">

          <span class="photo-surface">

        <button class="browser-help__secondary" id="browser-help-other" type="button" aria-controls="browser-help-arrow" aria-expanded="false">Usar otro navegador</button>
      </div>
    </dialog>
